<title>Tono Atelier · Color y corte</title>

<style>
/* Fashion editorial in black and paper; the only colour on the page is hair colour. */
:root{
  --paper:#F4F2EE; --white:#FFFFFF; --ink:#0F0F0F; --grey:#6B6862; --line:#D9D5CD;
  --copper:#B5562B; --honey:#D9A55B; --ash:#B9B3A8; --plum:#5B2333; --choc:#3B2418; --rose:#C98B7E;
  --f-d:"Montserrat","Helvetica Neue",Arial,sans-serif; --f-b:"Commissioner",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:300 17px/1.6 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-d);font-weight:300;margin:0;line-height:1;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
a{color:inherit}
.w{max-width:1260px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.k{font:500 11.5px/1 var(--f-b);letter-spacing:.28em;text-transform:uppercase;color:var(--grey)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 28px;font:500 13px/1 var(--f-b);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border:1px solid var(--ink);color:var(--ink);background:none;cursor:pointer;transition:background .25s,color .25s}
.btn:hover,.btn.f{background:var(--ink);color:var(--paper)}
.btn.f:hover{background:var(--copper);border-color:var(--copper)}
header{border-bottom:1px solid var(--line)}
header .w{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:18px;gap:16px}
nav{display:flex;gap:26px;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
nav a{text-decoration:none;color:var(--grey)}nav a:hover{color:var(--ink)}
.logo{font:400 24px/1 var(--f-d);letter-spacing:.3em;text-decoration:none;text-align:center}
.logo small{display:block;font:500 9px/1 var(--f-b);letter-spacing:.5em;margin-top:6px;color:var(--grey)}
.langs{justify-self:end;display:flex;gap:4px}
.langs button{border:0;background:none;font:500 12px/1 var(--f-b);letter-spacing:.14em;padding:8px 6px;color:var(--grey);cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
@media (max-width:860px){nav{display:none}header .w{grid-template-columns:auto 1fr}.logo{text-align:left}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:640px;border-bottom:1px solid var(--line)}
@media (max-width:900px){.hero{grid-template-columns:1fr;min-height:0}}
.hero .txt{padding:72px max(20px,calc((100vw - 1260px)/2 + 20px)) 64px;padding-right:48px;display:flex;flex-direction:column;justify-content:center;gap:26px}
@media (max-width:900px){.hero .txt{padding:44px 20px 48px}}
.hero h1{font-size:clamp(52px,7.4vw,116px);line-height:.92}
.hero .lede{font-size:19px;color:var(--grey);max-width:40ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.cred{display:flex;gap:36px;padding-top:26px;border-top:1px solid var(--line);flex-wrap:wrap}
.cred b{display:block;font:400 34px/1 var(--f-d)}
.cred span{font-size:13px;color:var(--grey)}
.strands{display:grid;grid-template-columns:repeat(6,1fr);position:relative;overflow:hidden;min-height:420px}
.strands i{display:block;height:100%;background-size:100% 200%;animation:fall 9s ease-in-out infinite alternate}
.strands i:nth-child(1){background-image:linear-gradient(var(--choc),var(--copper) 60%,var(--honey));animation-delay:-1s}
.strands i:nth-child(2){background-image:linear-gradient(var(--choc),#7A4A2E 50%,var(--honey));animation-delay:-3s}
.strands i:nth-child(3){background-image:linear-gradient(#2B2B2B,var(--ash) 70%,#ECE7DE);animation-delay:-5s}
.strands i:nth-child(4){background-image:linear-gradient(var(--choc),var(--plum) 60%,var(--rose));animation-delay:-2s}
.strands i:nth-child(5){background-image:linear-gradient(#1C120C,var(--choc) 50%,var(--copper));animation-delay:-4s}
.strands i:nth-child(6){background-image:linear-gradient(#5B4632,var(--honey) 55%,#F3E2C0);animation-delay:-6s}
@keyframes fall{from{background-position:0 0}to{background-position:0 100%}}
.strands .pic{position:absolute;right:7%;top:9%;width:42%;aspect-ratio:3/4;object-fit:cover;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);outline:10px solid var(--paper)}
@media (max-width:900px){.strands .pic{width:46%;top:7%}}
.strands .lbl{position:absolute;left:24px;bottom:24px;background:var(--paper);padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.strands .lbl b{font:400 18px/1 var(--f-d);text-transform:uppercase;letter-spacing:.06em}
.strands .lbl span{font-size:13px;color:var(--grey)}

section{padding-block:104px}
@media (max-width:700px){section{padding-block:64px}}
.sh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;margin-bottom:56px;align-items:end}
@media (max-width:800px){.sh{grid-template-columns:1fr;gap:14px}}
.sh h2{font-size:clamp(38px,5vw,72px)}
.sh p{color:var(--grey);max-width:44ch}

/* services */
.svc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 64px}
@media (max-width:800px){.svc{grid-template-columns:1fr}}
.svc h3{font-size:15px;letter-spacing:.26em;color:var(--grey);padding-bottom:14px;border-bottom:1px solid var(--ink);margin-top:28px}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 20px;padding:18px 0;border-bottom:1px solid var(--line)}
.li b{font-weight:500;font-size:17px}
.li span{grid-column:1;font-size:14px;color:var(--grey)}
.li em{grid-row:1/3;grid-column:2;align-self:center;font:400 22px/1 var(--f-d);font-style:normal}

/* colour lab */
.lab{background:var(--ink);color:var(--paper)}
.lab .sh p,.lab .k{color:#A9A49B}
.labgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
@media (max-width:860px){.labgrid{grid-template-columns:1fr}}
.tones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tones button{aspect-ratio:3/4;border:0;cursor:pointer;position:relative;outline-offset:3px;transition:transform .2s}
.tones button:hover{transform:translateY(-4px)}
.tones button[aria-pressed="true"]{outline:2px solid var(--paper)}
.tones button span{position:absolute;left:8px;bottom:8px;font:500 10.5px/1 var(--f-b);letter-spacing:.12em;text-transform:uppercase;background:rgba(15,15,15,.75);color:#fff;padding:5px 7px}
.readout{border:1px solid #333;padding:34px;display:flex;flex-direction:column;gap:16px;min-height:330px}
.readout h3{font-size:clamp(30px,3.4vw,44px)}
.readout dl{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;margin:6px 0 0;font-size:15px}
.readout dt{color:#A9A49B}.readout dd{margin:0}
.readout .sw{height:10px;margin:-34px -34px 10px}

/* editorial photo */
.ed{margin:0 0 20px;position:relative;overflow:hidden}
.ed img{width:100%;aspect-ratio:21/9;object-fit:cover;object-position:50% 30%;display:block;filter:grayscale(1) contrast(1.06)}
.ed figcaption{position:absolute;left:20px;bottom:20px;background:var(--paper);padding:12px 16px;font:400 15px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase}
@media (max-width:700px){.ed img{aspect-ratio:4/3}}
.vph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;margin-top:30px}
/* press */
.press{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:860px){.press{grid-template-columns:1fr}}
.pc{background:var(--white);padding:30px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.pc b{font:400 54px/1 var(--f-d)}
.pc p{color:var(--grey);font-size:15px}

.visit .w{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}
@media (max-width:860px){.visit .w{grid-template-columns:1fr;gap:32px}}
.visit h2{font-size:clamp(38px,5vw,72px)}
.info{display:grid;grid-template-columns:auto 1fr;gap:14px 32px;font-size:16px}
.info dt{color:var(--grey);font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding-top:3px}.info dd{margin:0;font-weight:500}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:13px;color:var(--grey)}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.strands i{animation:none}html{scroll-behavior:auto}}

.logo small{white-space:nowrap}
@media (max-width:560px){.logo{font-size:20px;letter-spacing:.24em}.logo small{font-size:8px;letter-spacing:.26em}}
</style>
</head>

  TONES.forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.style.background=t[2];b.setAttribute("aria-pressed",i===tone);b.setAttribute("aria-label",l==="ru"?t[1]:t[0]);
    const s=document.createElement("span");s.textContent=l==="ru"?t[1]:t[0];b.append(s);b.onclick=()=>{tone=i;render();};tn.append(b);});
  const t=TONES[tone],r=document.getElementById("readout");
  r.innerHTML='<div class="sw"></div><span class="k"></span><h3></h3><dl><dt></dt><dd></dd><dt></dt><dd></dd><dt></dt><dd></dd><dt></dt><dd></dd></dl>';
  r.querySelector(".sw").style.background=t[2];r.querySelector(".k").textContent=T.lCap[l];r.querySelector("h3").textContent=l==="ru"?t[1]:t[0];
  const dd=r.querySelectorAll("dt,dd");[[T.dTime[l],t[3][l]],[T.dSess[l],t[4]],[T.dKeep[l],t[5][l]],[T.dFrom[l],t[6]+" €"]].forEach(([a,b],i)=>{dd[i*2].textContent=a;dd[i*2+1].textContent=b;});
}
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
</script>
