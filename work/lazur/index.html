<!doctype html>
<html lang="es" data-default="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lazur · Cocina rusa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Imperial porcelain: cool white china, cobalt net, a thin line of gold. One plate is the hero. */
:root{
  --china:#F5F6F9; --white:#FFFFFF; --cobalt:#1F3A8A; --cobalt-d:#13245A; --ink:#111827; --muted:#5A6275; --gold:#B88A3E; --line:#DCE0EA;
  --f-d:"Forum",Georgia,"Times New Roman",serif; --f-b:"Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--china);color:var(--ink);font:16.5px/1.6 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-d);font-weight:400;margin:0;line-height:1.02;text-wrap:balance}
p{margin:0}
a{color:inherit}
.w{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.cap{font:600 11.5px/1 var(--f-b);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:2px;font:600 14px/1 var(--f-b);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--cobalt);color:var(--cobalt);background:none;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--cobalt);color:var(--white)}
.btn.f{background:var(--cobalt);color:var(--white)}
.btn.f:hover{background:var(--cobalt-d)}

/* net pattern */
.net{background-color:var(--white);background-image:
  linear-gradient(45deg,transparent 46%,var(--cobalt) 46% 54%,transparent 54%),
  linear-gradient(-45deg,transparent 46%,var(--cobalt) 46% 54%,transparent 54%),
  radial-gradient(circle,var(--gold) 0 9%,transparent 10%);
  background-size:26px 26px,26px 26px,26px 26px;background-position:0 0,0 0,13px 13px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--china) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--china)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:14px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.mono{width:40px;height:40px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:22px/1 var(--f-d);color:var(--cobalt)}
.logo b{font:400 24px/1 var(--f-d);letter-spacing:.08em}
nav{display:flex;gap:26px;font-size:14.5px;font-weight:500}
nav a{text-decoration:none;color:var(--muted)}nav a:hover{color:var(--cobalt)}
.right{display:flex;align-items:center;gap:14px}
.langs{display:flex;gap:2px}
.langs button{border:0;background:none;font:600 12px/1 var(--f-b);letter-spacing:.1em;padding:8px 7px;color:var(--muted);cursor:pointer;border-bottom:1.5px solid transparent}
.langs button[aria-pressed="true"]{color:var(--cobalt);border-color:var(--gold)}
@media (max-width:900px){nav{display:none}}
@media (max-width:520px){.right .btn{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:center;padding-block:72px 88px}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-block:40px 64px;gap:40px}}
.hero h1{font-size:clamp(64px,10vw,148px);letter-spacing:.01em;color:var(--cobalt)}
.hero h1 small{display:block;font:400 clamp(18px,1.8vw,24px)/1.3 var(--f-d);color:var(--ink);letter-spacing:.02em;margin-top:14px}
.hero .lede{font-size:18.5px;color:var(--muted);max-width:44ch;margin-top:26px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.proof{display:flex;gap:34px;margin-top:44px;padding-top:24px;border-top:1px solid var(--line);flex-wrap:wrap}
.proof div{display:flex;flex-direction:column;gap:4px}
.proof b{font:400 34px/1 var(--f-d);color:var(--cobalt)}
.proof span{font-size:13px;color:var(--muted)}
.plate-wrap{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:560px;width:100%;justify-self:center}
.plate{width:100%;aspect-ratio:1;border-radius:50%;position:relative;box-shadow:0 50px 80px -40px rgba(19,36,90,.45),0 0 0 1px var(--line)}
.plate::before{content:"";position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,var(--white) 0 60%,#EEF0F5 100%);box-shadow:0 0 0 3px var(--gold),0 0 0 9px var(--white),0 0 0 10px var(--gold),inset 0 6px 18px rgba(17,24,39,.08)}
.dish{position:absolute;inset:21%;border-radius:50%;display:grid;place-items:center}
.dumpling{position:absolute;width:24%;height:17%;background:radial-gradient(ellipse at 40% 35%,#FFFDF6,#EAD9B6 70%,#D2B98C);border-radius:55% 55% 48% 48%/70% 70% 35% 35%;box-shadow:0 6px 10px -4px rgba(90,60,20,.35)}
.dill{position:absolute;width:4%;height:4%;border-radius:50%;background:#4E7A3A}
.dish .crest{width:100%;height:100%;display:block;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.crest .ring{transform-origin:100px 100px;animation:lzspin 90s linear infinite}
@keyframes lzspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.crest .ring{animation:none}}
.dish img{width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.cream{position:absolute;width:26%;height:26%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFFFFF,#F1ECE1);left:37%;top:37%;box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}
.stamp{position:absolute;right:2%;bottom:6%;width:132px;height:132px;border-radius:50%;background:var(--cobalt);color:var(--white);display:grid;place-items:center;text-align:center;font:400 15px/1.15 var(--f-d);padding:18px;transform:rotate(-10deg);box-shadow:0 0 0 4px var(--china),0 0 0 5px var(--gold)}

/* band */
.band{height:16px;border-block:1px solid var(--gold)}

/* menu */
section{padding-block:96px}
@media (max-width:700px){section{padding-block:64px}}
.sh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:end;margin-bottom:48px}
@media (max-width:800px){.sh{grid-template-columns:1fr;gap:16px}}
.sh h2{font-size:clamp(40px,5.4vw,72px);color:var(--cobalt)}
.sh p{color:var(--muted);max-width:46ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px}
.tabs button{border:1px solid var(--line);background:var(--white);border-radius:99px;padding:10px 18px;font:600 14px/1 var(--f-b);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--white)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px}
@media (max-width:800px){.menu{grid-template-columns:1fr}}
.dishrow{padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 18px}
.dishrow h3{font-size:25px}
.dishrow .ru{font:400 15px/1.2 var(--f-d);color:var(--gold);letter-spacing:.04em}
.dishrow .pr{font:400 24px/1 var(--f-d);color:var(--cobalt);grid-row:1/3;grid-column:2;align-self:center}
.dishrow.wp{grid-template-columns:92px 1fr auto;gap:4px 20px}
.dishrow.wp img{grid-row:1/4;grid-column:1;width:92px;height:92px;object-fit:cover;border-radius:50%;box-shadow:0 0 0 3px var(--white),0 0 0 4px var(--gold);align-self:center}
.dishrow.wp h3,.dishrow.wp .ru{grid-column:2}.dishrow.wp .pr{grid-column:3}.dishrow.wp p{grid-column:2/4}
.dishrow p{grid-column:1/-1;color:var(--muted);font-size:14.5px;max-width:56ch}
.menu-note{margin-top:26px;font-size:13.5px;color:var(--muted)}

/* story */
.story{background:var(--cobalt);color:var(--white)}
.story .w{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:64px;align-items:center}
@media (max-width:860px){.story .w{grid-template-columns:1fr;gap:36px}}
.story h2{font-size:clamp(40px,5vw,66px)}
.story p{color:#C9D3EE;font-size:17.5px;max-width:52ch}
.story .cap{color:#E2C48C}
.story .col{display:flex;flex-direction:column;gap:22px}
.frame{aspect-ratio:4/5;border:1px solid #E2C48C;padding:14px}
.frame .ph{position:relative;width:100%;height:100%;overflow:hidden}
.frame .ph img{width:100%;height:100%;object-fit:cover;display:block}
.frame .ph div{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:84%}
.frame .net{width:100%;height:100%;display:grid;place-items:center}
.frame .net div{background:var(--white);color:var(--cobalt);padding:26px 30px;text-align:center;font:400 22px/1.25 var(--f-d);max-width:80%;box-shadow:0 0 0 1px var(--gold)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:10px;border-top:1px solid rgba(255,255,255,.2);padding-top:24px}
.facts b{display:block;font:400 40px/1 var(--f-d);color:var(--white)}
.facts span{font-size:13px;color:#C9D3EE}

/* events */
.ev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:860px){.ev{grid-template-columns:1fr}}
.evc{background:var(--white);border:1px solid var(--line);padding:30px;display:flex;flex-direction:column;gap:12px}
.evc h3{font-size:30px;color:var(--cobalt)}
.evc p{color:var(--muted);font-size:15px}
.evc b{font:400 22px/1 var(--f-d);margin-top:auto;padding-top:10px}

/* visit */
.visit .w{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}
@media (max-width:860px){.visit .w{grid-template-columns:1fr;gap:32px}}
.visit h2{font-size:clamp(40px,5vw,66px);color:var(--cobalt)}
.hours{display:grid;grid-template-columns:auto 1fr;gap:12px 30px;margin-top:28px;font-size:15.5px}
.hours dt{color:var(--muted)}.hours dd{margin:0;font-weight:600}
.map{border:1px solid var(--line);background:var(--white);aspect-ratio:4/3;position:relative;overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.map a{position:absolute;left:16px;bottom:16px}
footer{border-top:1px solid var(--line);padding-block:26px;font-size:13px;color:var(--muted)}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
