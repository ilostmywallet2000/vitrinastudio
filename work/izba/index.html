<title>Izba · Tienda de Europa del Este</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kurale&family=Oswald:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Izba's own brand: Khokhloma lacquer, red, gold and black, with bold yellow lettering. The neighbourhood shop where six communities meet. */
:root{
  --pine:#FBF3E3; --wood:#E0A526; --wood-d:#1B1210; --ink:#22140F; --muted:#6B5546; --red:#C4161C; --gold:#F6C935; --green:#3F6B45; --white:#FFFDF8; --line:#EED9B3;
  --f-d:"Kurale",Georgia,serif; --f-b:"Nunito Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--pine);color:var(--ink);font:400 17px/1.6 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-d);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
a{color:inherit}
.w{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.k{font:800 12px/1 var(--f-b);letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:14px;font:800 15px/1 var(--f-b);text-decoration:none;border:2px solid var(--wood-d);color:var(--wood-d);background:none;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--wood-d);color:var(--pine)}
.btn.f{background:var(--red);border-color:var(--red);color:#fff}.btn.f:hover{background:#9C2820}
/* embroidered border: rushnyk-style cross-stitch rhombs */
.stitch{display:none;height:22px;background:
  conic-gradient(from 45deg at 50% 50%,var(--red) 0 25%,transparent 0 50%,var(--red) 0 75%,transparent 0) 0 0/22px 22px,var(--white);
  -webkit-mask:radial-gradient(circle at 50% 50%,#000 0 6px,transparent 6.5px) 0 0/22px 22px;mask:radial-gradient(circle at 50% 50%,#000 0 6px,transparent 6.5px) 0 0/22px 22px}
.stitchband{height:30px;background:radial-gradient(circle at 50% 50%,var(--gold) 0 4px,transparent 4.5px) 0 0/30px 30px,radial-gradient(circle at 50% 50%,transparent 0 9px,var(--gold) 9.5px 11px,transparent 11.5px) 15px 15px/30px 30px,var(--red);border-block:3px solid var(--wood-d)}
header .w{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:16px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo svg{width:40px;height:44px}
.logo b{font:700 26px/1 "Oswald",Impact,sans-serif;letter-spacing:.06em;color:var(--gold);background:var(--red);padding:6px 12px 7px;border-radius:6px;text-shadow:0 2px 0 var(--wood-d)}
.logo small{display:block;font:800 10px/1 var(--f-b);letter-spacing:.2em;color:var(--muted);margin-top:4px}
nav{display:flex;gap:24px;font-weight:600;font-size:15px}nav a{text-decoration:none;color:var(--muted)}nav a:hover{color:var(--red)}
.langs{display:flex;gap:4px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:4px}
.langs button{border:0;background:none;font:800 12px/1 var(--f-b);padding:7px 9px;border-radius:8px;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--wood-d);color:var(--pine)}
@media (max-width:860px){nav{display:none}}

.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:52px;align-items:center;padding-block:56px 84px}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-block:30px 60px;gap:36px}}
.hero h1{font-size:clamp(46px,6.4vw,92px)}
.hero h1 em{font-style:normal;color:var(--red)}
.lede{font-size:19px;color:var(--muted);max-width:44ch;margin-top:22px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hellos{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.hellos span{background:var(--white);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.hellos span b{color:var(--red);font-weight:800;margin-right:6px}
/* carved window */
.win{position:relative;max-width:440px;width:100%;justify-self:center}
.win svg{width:100%;height:auto;display:block;filter:drop-shadow(0 30px 40px rgba(107,62,31,.28))}

section{padding-block:96px}
@media (max-width:700px){section{padding-block:64px}}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.sh h2{font-size:clamp(38px,5vw,66px);max-width:14ch}
.sh p{color:var(--muted);max-width:44ch}

/* communities */
.comm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.comm{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.comm{grid-template-columns:1fr}}
.cc{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:10px}
.cc .ph{margin:-24px -24px 6px;height:170px;overflow:hidden;border-radius:22px 22px 0 0}
.cc .ph img,.ar img{width:100%;height:100%;object-fit:cover;display:block}
.ar .im{margin:-20px -20px 6px;height:140px;overflow:hidden;border-radius:18px 18px 0 0}
.vph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px;margin-top:24px;display:block}
.cc .top{display:flex;justify-content:space-between;align-items:center}
.cc .flag{font-size:28px;line-height:1}
.cc .hi{font:400 22px/1 var(--f-d);color:var(--red)}
.cc h3{font-size:26px}
.cc p{color:var(--muted);font-size:15px}
.cc ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.cc li{background:var(--pine);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600}

/* this week */
.week{background:var(--wood-d);color:var(--pine);border-top:4px solid var(--gold)}
.week .sh p{color:#E9D6B8}.week .k{color:var(--gold)}
.arr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.arr{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ar{border:1px solid rgba(246,235,221,.25);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.ar .d{font:800 12px/1 var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ar h3{font-size:22px}
.ar p{color:#E3CDB5;font-size:14.5px}
.alert{margin-top:28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:rgba(246,235,221,.08);border:1px dashed rgba(246,235,221,.35);border-radius:18px;padding:20px 24px}
.alert p{max-width:60ch}
.alert .btn{border-color:var(--pine);color:var(--pine)}.alert .btn:hover{background:var(--pine);color:var(--wood-d)}

.visit .w{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
@media (max-width:860px){.visit .w{grid-template-columns:1fr}}
.visit h2{font-size:clamp(38px,5vw,66px)}
.info{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:28px;display:grid;grid-template-columns:auto 1fr;gap:14px 26px;align-self:start}
.info dt{color:var(--muted);font-weight:600}.info dd{margin:0;font-weight:800}
footer{padding-block:24px;font-size:13px;color:var(--muted)}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--wood);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* header fix: badge and tagline never touch */
.logo b{display:inline-block}
.logo small{margin-top:8px;white-space:nowrap}
@media (max-width:560px){.logo{gap:9px}.logo svg{width:32px;height:36px}.logo b{font-size:20px;padding:5px 10px 6px}.logo small{font-size:8.5px;letter-spacing:.14em;margin-top:6px}}
</style>
</head>
