<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polka · Tienda rusa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* A grocery shelf: printed labels, price tags, three colours of ink. Products are the pictures. */
:root{
  --paper:#FFFFFF; --shelf:#F2F0EA; --ink:#14213D; --red:#D33A2C; --mustard:#F2B33D; --green:#2F6B4F; --muted:#59617A; --line:#E1DED4;
  --f-d:"Unbounded",system-ui,sans-serif; --f-b:"IBM Plex Sans",system-ui,sans-serif; --f-m:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16.5px/1.55 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-d);font-weight:800;margin:0;line-height:1;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
a{color:inherit}
.w{max-width:1220px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tag{font:500 12px/1 var(--f-m);letter-spacing:.08em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 22px;border-radius:12px;font:600 15px/1 var(--f-b);text-decoration:none;border:2px solid var(--ink);color:var(--ink);background:var(--paper);cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn.r{background:var(--red);color:#fff}
.strip{background:var(--ink);color:#fff;font:500 13px/1 var(--f-m);letter-spacing:.06em;overflow:hidden;white-space:nowrap}
.strip div{display:inline-flex;gap:40px;padding:11px 0;animation:mq 40s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
header .w{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo .mk{display:flex;gap:3px}
.logo .mk i{width:10px;height:30px;border-radius:5px;background:var(--red)}
.logo .mk i:nth-child(2){background:var(--mustard)}.logo .mk i:nth-child(3){background:var(--green)}
.logo b{font:800 22px/1 var(--f-d);letter-spacing:-.02em}
.logo small{display:block;font:500 10.5px/1 var(--f-m);letter-spacing:.16em;color:var(--muted);margin-top:4px}
nav{display:flex;gap:24px;font-weight:500;font-size:15px}nav a{text-decoration:none}
.langs{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.langs button{border:0;background:none;font:500 12px/1 var(--f-m);padding:8px 10px;cursor:pointer;color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
@media (max-width:860px){nav{display:none}}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:56px 80px}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-block:32px 60px}}
.hero h1{font-size:clamp(44px,6.6vw,96px)}
.hero h1 span{color:var(--red)}
.hero .lede{font-size:19px;color:var(--muted);max-width:44ch;margin-top:24px}
.ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.origins{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.origins span{border:1.5px solid var(--ink);border-radius:99px;padding:7px 13px;font:500 12.5px/1 var(--f-m)}

/* shelf of product photos */
.shelfart{background:var(--shelf);border-radius:28px;padding:30px 22px 0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.row{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:0 6px;min-height:170px;border-bottom:14px solid #C9B48F;position:relative}
.row+.row{margin-top:58px}
.p{position:relative;margin:0;width:104px;height:124px;border-radius:12px;background:#fff var(--img) var(--x,50%) 62%/cover no-repeat;border:4px solid #fff;box-shadow:0 14px 26px -14px rgba(20,33,61,.45),0 0 0 1px var(--line)}
.row .p:nth-child(odd){height:138px}
.price{position:absolute;bottom:-50px;left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid var(--ink);font:500 11px/1 var(--f-m);padding:5px 7px;border-radius:4px;color:var(--ink);white-space:nowrap}
@media (max-width:520px){.p.hide-s{display:none}}

section{padding-block:96px}
@media (max-width:700px){section{padding-block:64px}}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.sh h2{font-size:clamp(36px,5vw,64px);max-width:14ch}
.sh p{color:var(--muted);max-width:44ch}

/* catalogue */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.filters button{border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:9px 15px;font:500 13px/1 var(--f-m);cursor:pointer;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.item{border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;background:#fff;transition:border-color .2s,transform .2s}
.item:hover{border-color:var(--ink);transform:translateY(-3px)}
.item .sw{height:120px;border-radius:12px;margin-bottom:8px;display:grid;place-items:center;font:800 15px/1 var(--f-d);color:#fff;text-align:center;padding:8px}
.item .sw.ph{background-size:cover!important;background-position:center!important;font-size:0}
.item h3{font:600 16px/1.25 var(--f-b);letter-spacing:0}
.item .o{font:500 11.5px/1 var(--f-m);color:var(--muted);letter-spacing:.04em}
.item .bt{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.item .pr{font:800 17px/1 var(--f-d)}
.st{font:500 11px/1 var(--f-m);padding:5px 8px;border-radius:6px}
.st.in{background:#E3F1E8;color:var(--green)}.st.lo{background:#FCEFD3;color:#8A5A00}.st.fr{background:#E3EAF8;color:#1E3A8A}

/* how to order */
.how{background:var(--shelf)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:860px){.steps{grid-template-columns:1fr}}
.step{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:26px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.step .n{font:800 40px/1 var(--f-d);color:var(--red)}
.step h3{font-size:22px}
.step p{color:var(--muted);font-size:15px}

/* gifts */
.gifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:860px){.gifts{grid-template-columns:1fr}}
.gift{border-radius:22px;padding:28px;color:#fff;display:flex;flex-direction:column;gap:12px;min-height:280px;position:relative;overflow:hidden}
.gift::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border:14px solid rgba(255,255,255,.18);border-radius:50%}
.gift h3{font-size:26px}
.gift p{opacity:.85;font-size:15px;max-width:30ch}
.gift b{margin-top:auto;font:800 30px/1 var(--f-d)}
.g1{background:var(--red)}.g2{background:var(--ink)}.g3{background:var(--green)}

.visit .w{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:860px){.visit .w{grid-template-columns:1fr}}
.visit h2{font-size:clamp(36px,5vw,64px)}
.vph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);margin-top:20px;display:block}
.card{border:2px solid var(--ink);border-radius:22px;padding:26px;display:grid;grid-template-columns:auto 1fr;gap:12px 24px;box-shadow:6px 6px 0 var(--ink)}
.card dt{font:500 12px/1.6 var(--f-m);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.card dd{margin:0;font-weight:600}
footer{border-top:1.5px solid var(--line);padding-block:24px;font-size:13px;color:var(--muted)}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.strip div{animation:none}html{scroll-behavior:auto}}
</style>
</head>
